  },
  "statistics": {
    "primary": "two game-specific paired mean contrasts per corpus; equal root weights within seed, equal seed weights; conditional matched population explicit",
    "multiplicity": "Bonferroni 97.5-percent two-sided intervals for two primary games within each corpus (familywise 95 percent); replication corpus analyzed as replication, no pooled primary claim",
