    "split_ownership": "episode group assigned before windows; symmetry-related episodes/roots grouped; locked generation after Review 3",
    "roles": ["train", "development", "locked"],
    "selection": "development combines validation and bounded selection; no independent selection-confirmation claim",
    "shared_start_track": "common openings permitted and enumerated for behavior training; these are not isolated generalization evidence",
