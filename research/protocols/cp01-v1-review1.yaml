  "format": "JSON-compatible YAML; parse with Python json",
  "scope": {
    "question": "Sensitivity of root decisions to critical opponent reply errors",
    "games": ["connect4-6x7", "reversi6"],
    "population": "Fresh legal late-game roots from declared behavior episodes; same-size only",
    "primary_reference": "terminal-solved complete legal two-ply fork, root-player utility -1/0/+1",
    "extensions": ["separately named fixed-horizon reference", "H4 sensitivity", "paired-play external validity"],
    "deferred": ["board-size transfer", "new ranking objective", "self-play RL"],
    "chess": "Decide inclusion before Review 3 by rules/history, data, paired-play readiness and cost; default defer if unmet"
  },
  "reference_contract": {
    "q": "q(s,a,b) is root-player terminal minimax utility after exact a,b",
    "Q": "Q(s,a)=min_b q(s,a,b); a terminal first action has exact utility and no reply set",
    "regret": "max_a Q(s,a)-Q(s,selected_action), range [0,2]",
    "tie_tolerance": 1e-10,
    "tie_rule": "smallest legal action ID; preserve full best/worst sets for metrics",
    "forced_pass": "ordinary legal transition, consumes one ply and reverses actor; terminal detection precedes expansion",
    "critical_reply": "unique reference worst b for a suboptimal own action a; deleting b raises Q(s,a) to at least the original optimal root utility, with gap >= 0.5 to the next-worst reply",
    "critical_selection": "lexicographically smallest qualifying (a,b) per root; reference-only, no model score",
    "control_candidates": "same root and same own action a, noncritical nonterminal H2 replies, with gap >= 0.5 above Q(s,a)",
    "terminal_entries": "exact terminal branches are never learned or repaired; report separately",
    "epsilon_worst_reply": 0.0,
    "incomplete": "do not use partial action maps as exact; retain attempt and missingness; no easier-root replacement"
  },
  "interventions": {
    "primary_depth": 2,
    "operator": "complete exact legal tree with fixed action order and scalar leaf table; no search pruning differences between conditions",
    "natural": "recursive learned transition/value leaves, exact terminal override",
    "primary_repair": "replace one nonterminal q_hat(s,a,b) by common q_ref(s,a,b); all other scalar entries unchanged",
    "matching": "choose control minimizing absolute difference in abs(q_hat-q_ref) from critical branch; same root/a/depth/nonterminal status, caliper 0.1; tie smallest b ID; no replacement or post-repair outcome use",
    "primary_contrast": "regret(noncritical repair)-regret(critical repair) within checkpoint/root matched pairs in multi-step JEPA",
    "population": "conditional checkpoint/root matched population, separately per game and training corpus; no unconditional causal interpretation",
    "required_coverage": "eligible/complete/critical/repairable/matched/unmatched/failed denominators by game, corpus and seed",
    "unmatched_reporting": "all-root critical-repair effects and worst-case [-2,2] mean bounds for excluded contrast units; failed evaluation cannot be zero-imputed",
    "secondary": ["exact-state re-encoding using same online encoder/value head", "full common reference leaf substitution", "other arms' repair sensitivity", "tie-aware worst-reply preservation", "natural decision agreement and regret", "separate capped-search sensitivity"],
    "limits": "scalar location sensitivity does not identify lost latent information; model-dependent matching changes population; error magnitude and root strata reported; interventions can worsen decisions"
  },
  "models": {
    "arms": ["multi-step-jepa", "single-horizon-jepa", "value-only-latent-rollout", "recursive-raw-state", "direct-leaf-value"],
    "starting_source": "two_player/v212_model.py after derivative repair",
    "dimensions": {"features": 198, "latent": 32, "actions": 65},
    "supervision": "same recorded behavior action and terminal outcome labels; label equals behavior-mixture outcome, not minimax value",
    "control": "paired initialization seeds, data/windows/order, updates, shared policy/value losses; objective-specific graphs disclosed",
    "cost": "equal data/updates primary; measured time, calls, memory, parameters and scoped operation estimates; no dummy compute or inherited 5-percent FLOP gate",
    "training_settings": "Review 2 freezes pilot Adam/EMA, clipping, weights and schedule; Review 3 freezes final duration/config once from development"
  },
  "data_contract": {
