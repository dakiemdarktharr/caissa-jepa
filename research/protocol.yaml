  "reference_contract": {
    "q": "q(s,a,b) is root-player terminal minimax utility after exact a,b",
    "Q": "Q(s,a)=min_b q(s,a,b); a terminal first action has exact utility and no reply set",
    "regret": "max_a Q(s,a)-Q(s,selected_action), range [0,2]",
    "tie_tolerance": 1e-10,
    "tie_rule": "smallest legal action ID; preserve full best/worst sets for metrics",
    "forced_pass": "ordinary legal transition, consumes one ply and reverses actor; terminal detection precedes expansion",
    "critical_reply": "unique reference worst b for a suboptimal own action a; deleting b raises Q(s,a) to at least the original optimal root utility, with gap >= 0.5 to the next-worst reply",
    "critical_selection": "Build all qualifying reference-critical pairs first; a primary pair requires nonterminal H2 critical child and at least one same-root/own-action noncritical nonterminal child with reference gap >=0.5. Choose lexicographically first such (a,b), before any model evaluation. Independently count terminal-critical and no-control roots.",
    "control_candidates": "same root and same own action a, noncritical nonterminal H2 replies, with gap >= 0.5 above Q(s,a)",
    "terminal_entries": "exact terminal branches are never learned or repaired; report separately",
    "epsilon_worst_reply": 0.0,
    "incomplete": "do not use partial action maps as exact; retain attempt and missingness; no easier-root replacement"
  },
  "interventions": {
    "primary_depth": 2,
    "operator": "complete exact legal tree with fixed action order and scalar leaf table; no search pruning differences between conditions",
    "natural": "recursive learned transition/value leaves, exact terminal override",
