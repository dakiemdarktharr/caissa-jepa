    "matching": "Residual e=q_hat-q_ref; same residual sign under tolerance 1e-10, then abs(abs(e_control)-abs(e_critical)) <=0.1. Choose smallest magnitude difference then smallest b ID, without post-repair outcome use. Zero residuals are a separate sign stratum; no-match reasons retained.",
    "primary_contrast": "regret(noncritical repair)-regret(critical repair) within checkpoint/root matched pairs in multi-step JEPA",
    "population": "conditional checkpoint/root matched population, separately per game and training corpus; no unconditional causal interpretation",
    "required_coverage": "Every scheduled seed/root counted in nested scheduled -> complete reference -> reference-critical -> nonterminal-critical -> reference-pairable -> model-evaluable -> common-sign-support -> caliper-matched. Report root failure, terminal-critical, no-control, no-sign-support, caliper-unmatched separately by game/corpus/seed/sign. Counts reconcile; no root replacement.",
    "unmatched_reporting": "Conditional primary remains undefined for zero-match seeds. Secondary scheduled-policy contrast: use the two repairs on matched units, otherwise both conditions equal natural (contrast 0 for known structural noneligibility/nonmatch). Unknown reference/evaluation/matching status has contrast in [-2,2]. Bound each seed mean over ALL its predeclared N_g scheduled roots by (sum_observed_D +/-2*n_unknown)/N_g; then average over ALL scheduled seeds. These bound the coverage-adjusted repair-policy contrast, not an imaginary matched effect on nonmatches.",
    "secondary": [
      "exact-state re-encoding using same online encoder/value head",
