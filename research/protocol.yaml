    "limits": "Operational reference-defined stress test, not discovery that the model identifies criticality or identification of lost latent information. Repair compares behavior-trained values to minimax targets, mixing target mismatch and prediction/readout error. Signed magnitude matching restricts common support and does not remove all confounding; report sign/error/root strata and coverage.",
    "all_root_critical": "Secondary scheduled-root effect natural regret minus one critical scalar repair; select the lexicographically first nonterminal reference-critical pair, even without a noncritical control; no critical pair means no-op effect 0. Unknown/failed unit receives [-2,2] sensitivity bounds, never zero."
